<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — Circle Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded shadow p-6">
    <h1 class="text-2xl font-bold mb-4">Admin Sign In</h1>

    <div id="error" class="text-red-600 text-sm mb-3 hidden"></div>

    <label class="block mb-2 text-sm">Email</label>
    <input id="email" type="email" class="w-full border p-2 rounded mb-3">

    <label class="block mb-2 text-sm">Password</label>
    <input id="password" type="password" class="w-full border p-2 rounded mb-4">

    <button id="signinBtn" class="w-full bg-indigo-600 text-white px-4 py-2 rounded">Sign in</button>

    <p class="text-xs text-gray-500 mt-3">This page signs you in to the admin panel only. Admin rights are granted in the Supabase dashboard.</p>
  </div>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden z-50">
    <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-indigo-500"></div>
  </div>

  <script src="/js/admin-login.js"></script>
</body>
</html>
